# Internal-only listener (port 8080 is not published) from which the backend fetches the built
# index.html to render storefront pages into (backend/app/utils/spa_shell.py, SPA_SHELL_URL).
# Lives in conf.d/ next to default.conf, so it's loaded whichever site config is mounted there.
server {
    listen 8080;
    root /usr/share/nginx/html;
    access_log off;

    location = /index.html {
        etag on;
    }

    location / {
        return 404;
    }
}
