# nexureco.com storefront: everything inside its server block except listen/ssl/server_name.
# Installed in the image at /etc/nginx/snippets/storefront.conf and included by frontend/nginx.conf,
# frontend/nginx-ssl.conf and production's /opt/mybrand/nginx-origin-ssl.conf, so site changes ship
# with the image instead of being hand-edited on the server.
#
# The including server block must set $mybrand_backend to the backend's host:port first:
#   set $mybrand_backend backend:8000;              # docker-compose / app-network
#   set $mybrand_backend mybrand-backend-1:8000;    # production (the container is also on edge-net,
#                                                   # where "backend" is another project's container)
# proxy_pass through a variable resolves the name per request via Docker's DNS, so a recreated
# backend container is picked up without reloading nginx.

resolver 127.0.0.11 valid=10s ipv6=off;

root /usr/share/nginx/html;
index index.html;

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

# Serve pre-compressed .gz files when available (avoids CPU per-request)
gzip_static on;

# Security headers. A location with its own add_header drops these, so the page locations below have none.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
# The legacy XSS auditor is removed from browsers and could itself be abused; "0" turns it off (CSP covers XSS)
add_header X-XSS-Protection "0" always;
# Nothing on the site needs these device features, so third-party scripts can't ask for them either
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=(self)" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browsers ignore HSTS on plain-HTTP responses, so this is harmless on the local HTTP-only config
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Report-Only: violations are logged by the backend ("CSP violation" in its logs), nothing is blocked.
# Once the logs are clean, rename the header to Content-Security-Policy to enforce it.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://analytics.tiktok.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com https://connect.facebook.net https://*.tiktok.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src 'self' https://www.facebook.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri /api/v1/csp-report" always;

# Cache static assets
location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
    # A missing asset gets the site's small 404 page instead of nginx's default one
    error_page 404 /404.html;
}

location = /404.html {
    internal;
}

# Proxy API requests to backend
location /api {
    proxy_pass http://$mybrand_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_connect_timeout 90s;
    client_max_body_size 10m;
}

# Proxy uploads requests to backend (^~ so the static-asset regex above doesn't catch upload images)
location ^~ /uploads {
    proxy_pass http://$mybrand_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Proxy static assets (logo etc.) to backend (^~ for the same reason)
location ^~ /static {
    proxy_pass http://$mybrand_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    expires 30d;
}

# Crawler-facing files generated by the backend from the live catalog
location = /sitemap.xml {
    proxy_pass http://$mybrand_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /llms.txt {
    proxy_pass http://$mybrand_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /feeds/ {
    proxy_pass http://$mybrand_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Real files (index.html, robots.txt, ...) are served as-is and always revalidated so deploys
# take effect immediately; every other path is a storefront page.
location / {
    expires epoch;
    try_files $uri @storefront;
}

# Storefront pages are rendered by the backend (backend/app/api/storefront.py): the SPA shell with
# the page's title, description, canonical, Open Graph tags, JSON-LD, and a 404 status for unknown
# URLs. If the backend is down or failing, fall back to the plain shell so the site keeps working.
location @storefront {
    rewrite ^ /_render$uri break;
    proxy_pass http://$mybrand_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 =200 /index.html;
}
