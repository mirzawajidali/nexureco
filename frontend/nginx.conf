# ── HTTP Server (always active) ──
server {
    listen 80;
    server_name _;

    # ACME challenge for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Site config shared with nginx-ssl.conf and production (nginx/storefront.conf)
    set $mybrand_backend backend:8000;
    include /etc/nginx/snippets/storefront.conf;
}
